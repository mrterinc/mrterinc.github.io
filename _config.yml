name: Mert Erinc
email: mert.erinc@bi.no
description: > # this means to ignore newlines until "url:"
  My personal website giving information about my academic activities. 
footer_text: >
  Powered by <a href="http://jekyllrb.com/" target="_blank">Jekyll</a>.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

url: https://mrterinc.github.io # site root; used for canonical and Open Graph URLs
baseurl:  # should be empty
last_updated: # leave blank if you don't want to display last updated

# -----------------------------------------------------------------------------
# Open Graph
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
# To achieve this, change serve_og_meta to true and then provide the URL of the
# preview image as the value of og_image.
serve_og_meta: true # Include Open Graph meta tags in the HTML head
og_image: https://mrterinc.github.io/assets/img/prof_pic.jpg # The site-wide (default for all links) Open Graph preview image
# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
github_username: mrterinc
#twitter_username: # your Twitter handle
linkedin_username: mert-erinc-29752827
scholar_userid: dvoshcQAAAAJ
orcid_id: 0000-0002-4498-5812
#medium_username: # your Medium username
#quora_username: # your Quora username
#publons_id: # your ID on Publons
research_gate_profile: Mert_Erinc2
#blogger_url: # your blogger URL

contact_note: >
  mert.erinc@bi.no,
  Nydalsveien 37, 0484 Oslo, Norway

# Analytics. The old Universal Analytics property stopped collecting data in July 2023 and
# has been removed. To turn analytics back on, create a site at goatcounter.com and put its
# code here (the subdomain only, e.g. mrterinc for mrterinc.goatcounter.com).
#goatcounter_code:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Build settings
markdown: kramdown
highlighter: pygments

# Includes & excludes
include: ['_pages']
exclude: [vendor]

# Plug-ins
plugins:
    - jekyll-email-protect
    - jekyll-paginate
    - jekyll/scholar
    - jemoji

# Jekyll-Scholar
scholar:

  last_name: Erinc

  style: apa
  locale: en

  sort_by: year
  order: descending

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

# -----------------------------------------------------------------------------
# Other settings
# -----------------------------------------------------------------------------
jquery_version: "1.12.4"
katex_version: "0.9.0"
anchorjs_version: "3.2.2"
